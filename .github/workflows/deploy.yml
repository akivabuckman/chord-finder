name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Authenticate to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-southeast-1 | \
          docker login --username AWS --password-stdin \
          ${{ vars.ECR_REGISTRY }}

      - name: Resolve Git commit SHA
        run: echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=$GIT_SHA \
            -t chord-finder:latest .

      - name: Tag Docker image for ECR
        run: |
          docker tag chord-finder:latest \
            ${{ vars.ECR_REGISTRY }}/chord-finder:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ vars.ECR_REGISTRY }}/chord-finder:latest

      - name: Deploy container on EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ vars.ECR_REGISTRY }}/chord-finder:latest
            docker stop chord-finder || true
            docker rm chord-finder || true
            docker run -d \
              --name chord-finder \
              --network web \
              ${{ vars.ECR_REGISTRY }}/chord-finder:latest
