name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo 
      - uses: actions/checkout@v3

      - name: Debug env
        run: |
          echo "AWS_ACCESS_KEY_ID is set? ${AWS_ACCESS_KEY_ID:+yes}"
          echo "AWS_SECRET_ACCESS_KEY is set? ${AWS_SECRET_ACCESS_KEY:+yes}"


      # 2️⃣ Configure AWS credentials
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      # 3️⃣ Login to ECR
      - run: |
          aws ecr get-login-password --region ap-southeast-1 | \
          docker login --username AWS --password-stdin 656301689621.dkr.ecr.ap-southeast-1.amazonaws.com

      # 4️⃣ Build Docker image
      - run: |
          # Get short Git SHA of the current commit
          GIT_SHA=$(git rev-parse --short HEAD)

          # Build the Docker image with the SHA as a build-arg
          docker build --build-arg GIT_SHA=$GIT_SHA -t chord-finder:latest .

          # Tag it for ECR
          docker tag chord-finder:latest 656301689621.dkr.ecr.ap-southeast-1.amazonaws.com/chord-finder:latest

      # 5️⃣ Push to ECR
      - run: |
          docker push 656301689621.dkr.ecr.ap-southeast-1.amazonaws.com/chord-finder:latest

      # 6️⃣ SSH into EC2 and update container
      - uses: appleboy/ssh-action@v0.1.9
        with:
          host: ec2-52-221-210-41.ap-southeast-1.compute.amazonaws.com

          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull 656301689621.dkr.ecr.ap-southeast-1.amazonaws.com/chord-finder:latest
            docker stop chord-finder || true
            docker rm chord-finder || true
            docker run -d --name chord-finder --network web 656301689621.dkr.ecr.ap-southeast-1.amazonaws.com/chord-finder:latest
